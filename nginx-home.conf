server {
    listen 80 default_server;
    server_name _;
    root /var/www/home;
    index index.html;
    location = /status.json { add_header Cache-Control "no-store"; }
    location ~ \.(html|json)$ { add_header Cache-Control "no-cache"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
